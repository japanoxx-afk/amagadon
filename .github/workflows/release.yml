name: Build launcher
on:
  push:
    tags: ['v*']
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned compatibility library
        shell: powershell
        run: ./scripts/fetch-compat.ps1
      - name: Build
        shell: powershell
        run: ./scripts/build.ps1
      - name: Test
        shell: powershell
        run: |
          $test = Start-Process ./dist/AmagadonLauncher.exe -ArgumentList '--self-test' -PassThru -Wait -WindowStyle Hidden
          if ($test.ExitCode -ne 0) { throw 'Self-test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: AmagadonLauncher
          path: |
            dist/AmagadonLauncher.zip
            dist/AmagadonLauncher.zip.sha256
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" ./dist/AmagadonLauncher.zip ./dist/AmagadonLauncher.zip.sha256 --notes-file PATCHNOTES.md
